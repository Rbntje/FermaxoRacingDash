name: FermaxoRacing
options:
  bundleIdPrefix: com.fermaxo
  deploymentTarget:
    iOS: "16.0"
targets:
  FermaxoRacing:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../index.html
        buildPhase: resources
      - path: ../style.css
        buildPhase: resources
      - path: ../app.js
        buildPhase: resources
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fermaxo.racingdash
        PRODUCT_NAME: Fermaxo Racing
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
